<!DOCTYPE html>
<html lang="es">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>EXPOBIO 2026 - Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="https://files.catbox.moe/zftv8w.png">
    <link rel="shortcut icon" href="https://files.catbox.moe/zftv8w.png">
</head>

<body>
    <div class="carta">
        <div class="box-titulo">
            <img class="Escudo-UNSAAC" src="Logaso.png" alt="Escudo UNSAAC">
        </div>
    </div>
    
    <div class="carta">
        <div class="box-pagos">
            <div class="box-pagos-logo">
                <h1>EXPOBIO 2026</h1>
                <h2>Portal de Información del Evento</h2>
            </div>
            
            <div class="box-estudiante-grupo10">
                <div class="estudiante">
                    <button class="btn-estudiante" onclick="window.top.location.href='https://expobio.github.io/INSCRIPCION/'">
                        <h1>Inscripción</h1>
                        <p>Regístrate para participar en la expo</p>
                    </button>
                </div>
                <div class="grupo10">
                    <button class="btn-grupo10" onclick="window.top.location.href='#concursos'">
                        <h1>Concursos</h1>
                        <p>Explora las categorías y participa</p>
                    </button>
                </div>
            </div>
            
            <div class="box-egresado">
                <button class="btn-egresado" onclick="window.top.location.href='#programacion'">
                    <h1>Programación</h1>
                    <p>Agenda y actividades del evento</p>
                </button>
            </div>
            
            <div class="box-consultas">
                <button class="btn-consultas" onclick="window.top.location.href='https://expobio.github.io/CONSULTAS/'">
                    <h1>Consultas</h1>
                    <p>Resuelve tus dudas sobre el evento</p>
                </button>
            </div>
        </div>
    </div>

    <div class="carta" id="concursos">
        <div class="box-pagos">
            <div class="box-pagos-logo">
                <h1>Concursos</h1>
                <h2>Categorías disponibles</h2>
            </div>
            
            <div class="box-estudiante-grupo10">
                <div class="estudiante">
                    <button class="btn-estudiante" onclick="window.top.location.href='#'">
                        <h1>Investigación</h1>
                        <p>Proyectos de investigación científica</p>
                    </button>
                </div>
                <div class="grupo10">
                    <button class="btn-grupo10" onclick="window.top.location.href='#'">
                        <h1>Resúmenes</h1>
                        <p>Resúmenes de investigaciones</p>
                    </button>
                </div>
            </div>
            
            <div class="box-egresado">
                <button class="btn-egresado" onclick="window.top.location.href='#'">
                    <h1>Poster Científico</h1>
                    <p>Presentación de pósters científicos</p>
                </button>
            </div>
        </div>
    </div>

    <div class="carta" id="programacion">
        <div class="box-pagos">
            <div class="box-pagos-logo">
                <h1>Programación</h1>
                <h2>Agenda del Evento</h2>
            </div>
            
            <div class="guia-seccion">
                <h2>📅 Día 1 - Viernes</h2>
                <p>Inauguración, conferencias magistrales y presentación de trabajos.</p>
            </div>
            
            <div class="guia-seccion">
                <h2>📅 Día 2 - Sábado</h2>
                <p>Talleres, mesas redondas y premiación.</p>
            </div>
        </div>
    </div>

    <div class="carta">
        <div class="box-pagos">
            <div class="box-pagos-logo">
                <h1>Enlaces Rápidos</h1>
            </div>
            
            <div class="box-estudiante-grupo10">
                <div class="estudiante">
                    <button class="btn-estudiante" onclick="window.top.location.href='https://expobio.github.io/INSCRIPCION/guia.html'">
                        <h1>Guía de Pago</h1>
                        <p>Instrucciones para realizar el pago</p>
                    </button>
                </div>
                <div class="grupo10">
                    <button class="btn-grupo10" onclick="window.top.location.href='https://expobio.github.io/INSCRIPCION/datosEstudiante.html'">
                        <h1>Inscripción Estudiante</h1>
                        <p>Formulario de inscripción individual</p>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
